<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2440"/>
      <stop offset="0.55" stop-color="#0E1428"/>
      <stop offset="1" stop-color="#070A16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#E8C46A" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#E8C46A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1C2"/>
      <stop offset="0.35" stop-color="#EBC871"/>
      <stop offset="0.75" stop-color="#C9963E"/>
      <stop offset="1" stop-color="#9C6E25"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9873A"/>
      <stop offset="1" stop-color="#7A531A"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="5" y="5" width="502" height="502" rx="110" fill="none" stroke="#E8C46A" stroke-opacity="0.22" stroke-width="3"/>
  <g id="art">
    <!-- banknote peeking out -->
    <g transform="rotate(-14 256 200)">
      <rect x="138" y="112" width="236" height="150" rx="22" fill="url(#emerald)"/>
      <circle cx="256" cy="176" r="30" fill="none" stroke="#ECFDF5" stroke-opacity="0.75" stroke-width="7"/>
      <rect x="160" y="132" width="34" height="8" rx="4" fill="#ECFDF5" fill-opacity="0.6"/>
    </g>
    <!-- wallet body -->
    <rect x="104" y="184" width="304" height="210" rx="42" fill="url(#gold)"/>
    <rect x="104" y="184" width="304" height="70" rx="42" fill="url(#sheen)" opacity="0.5"/>
    <path d="M128 230 H384" stroke="#7A531A" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
    <!-- clasp -->
    <rect x="300" y="250" width="128" height="86" rx="30" fill="url(#goldDark)"/>
    <rect x="300" y="250" width="128" height="86" rx="30" fill="none" stroke="#FFF1C2" stroke-opacity="0.45" stroke-width="3"/>
    <circle cx="346" cy="293" r="15" fill="#FFF6DA"/>
    <circle cx="346" cy="293" r="6" fill="#B9873A"/>
  </g>
</svg>
